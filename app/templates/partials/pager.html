{% if pages > 1 %}
<div class="pager">
 {% set base_url = request.url.path %}
 {% for i in range(1, pages+1) %}
   {% if i == page %}<span class="cur">{{ i }}</span>
   {% elif i <= 2 or i > pages-2 or (i >= page-1 and i <= page+1) %}
     <a href="{{ base_url }}?{{ qs(search=search|default(''),status=status|default(''),pkg=pkg|default(''),sort=sort|default('id'),dir=dir|default('asc'),router=router|default(''),state=state|default(''),method=method|default(''),from_=from_|default(''),to=to|default(''),cat=cat|default(''),user_f=user_f|default(''),page=i) }}">{{ i }}</a>
   {% elif i == 3 or i == pages-2 %}<span>…</span>{% endif %}
 {% endfor %}
 <span class="info">Halaman {{ page }}/{{ pages }}</span>
</div>
{% endif %}
